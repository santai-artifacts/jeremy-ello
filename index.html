<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a28aa 0%, #1a3a2a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-wrapper {
            margin-bottom: 2rem;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            background-color: #0a1f14;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            display: block;
            margin: 0 auto;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin-top: 1.5rem;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .score-box {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            padding: 1rem 2rem;
            border-radius: 8px;
            min-width: 150px;
        }

        .score-label {
            font-size: 0.9rem;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .score-value {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a1f14;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #aaa;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .instructions p {
            margin: 0.5rem 0;
        }

        .game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-screen.active {
            display: flex;
        }

        .game-over-content {
            background: linear-gradient(135deg, #0d2818, #1a3a2a);
            border: 3px solid #00ff88;
            padding: 3rem 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .game-over-content h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #ff6b6b;
        }

        .game-over-content p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #00ff88;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            #gameCanvas {
                max-width: 100%;
            }

            .info {
                gap: 1rem;
            }

            .score-box {
                min-width: 120px;
                padding: 0.75rem 1.5rem;
            }

            .score-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 SNAKE</h1>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div class="info">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">High Score</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start Game</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="instructions">
            <p><strong>Desktop:</strong> Use arrow keys or WASD to move</p>
            <p><strong>Mobile:</strong> Swipe to change direction</p>
        </div>
    </div>

    <div class="game-over-screen" id="gameOverScreen">
        <div class="game-over-content">
            <h2>Game Over</h2>
            <p id="finalScore">Score: 0</p>
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') ? parseInt(localStorage.getItem('snakeHighScore')) : 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameOver = false;

        highScoreDisplay.textContent = highScore;

        function generateFood() {
            let newFood;
            let foodOnSnake;
            do {
                newFood = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
                foodOnSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            } while (foodOnSnake);
            return newFood;
        }

        function update() {
            if (!gameRunning || gamePaused || gameOver) return;

            direction = nextDirection;

            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            // Check wall collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                endGame();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                food = generateFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a1f14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (optional, subtle)
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = 'rgba(0, 255, 136, 0.5)';
                    ctx.shadowBlur = 10;
                } else {
                    // Body
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = 'rgba(0, 255, 136, 0.3)';
                    ctx.shadowBlur = 5;
                }
                ctx.fillRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
            });
            ctx.shadowColor = 'transparent';

            // Draw food
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = 'rgba(255, 107, 107, 0.5)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowColor = 'transparent';
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gamePaused = false;
                gameOver = false;
                gameOverScreen.classList.remove('active');
                startBtn.textContent = 'Resume';
                pauseBtn.disabled = false;
            }
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? 'Resume' : 'Pause';
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            food = generateFood();
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            scoreDisplay.textContent = score;
            gameRunning = false;
            gamePaused = false;
            gameOver = false;
            gameOverScreen.classList.remove('active');
            startBtn.textContent = 'Start Game';
            pauseBtn.disabled = true;
            pauseBtn.textContent = 'Pause';
        }

        function endGame() {
            gameRunning = false;
            gameOver = true;
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.classList.add('active');
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', resetGame);
        playAgainBtn.addEventListener('click', () => {
            resetGame();
            startGame();
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || gameOver) return;

            const key = e.key.toLowerCase();

            if (key === 'arrowup' || key === 'w') {
                if (direction.y === 0) nextDirection = {x: 0, y: -1};
                e.preventDefault();
            } else if (key === 'arrowdown' || key === 's') {
                if (direction.y === 0) nextDirection = {x: 0, y: 1};
                e.preventDefault();
            } else if (key === 'arrowleft' || key === 'a') {
                if (direction.x === 0) nextDirection = {x: -1, y: 0};
                e.preventDefault();
            } else if (key === 'arrowright' || key === 'd') {
                if (direction.x === 0) nextDirection = {x: 1, y: 0};
                e.preventDefault();
            }
        });

        // Touch controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning || gameOver) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const threshold = 50;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > threshold && direction.x === 0) {
                    nextDirection = {x: 1, y: 0};
                } else if (deltaX < -threshold && direction.x === 0) {
                    nextDirection = {x: -1, y: 0};
                }
            } else {
                if (deltaY > threshold && direction.y === 0) {
                    nextDirection = {x: 0, y: 1};
                } else if (deltaY < -threshold && direction.y === 0) {
                    nextDirection = {x: 0, y: -1};
                }
            }
        });

        // Initialize
        resetGame();
        pauseBtn.disabled = true;
        gameLoop();
    </script>
</body>
</html>
